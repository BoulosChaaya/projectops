services:
  - type: web
    name: projectops
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --prod --frozen-lockfile
    startCommand: node --experimental-strip-types scripts/projectops-render-start.mjs
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: projectops-postgres
          property: connectionString
databases:
  - name: projectops-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"
