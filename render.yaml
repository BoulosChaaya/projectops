# Render Blueprint: one Node web service and one managed PostgreSQL database.
# Applying it creates billed resources (about $13/month at the time of writing); review the plan
# Render shows before clicking Apply. Field reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: projectops
    runtime: node
    # Smallest paid instance (0.5 CPU, 512 MB). It never sleeps, unlike the free instance, and has a Shell.
    plan: 0.5c-512mb
    # Frankfurt: closest Render region to the owner. Fixed at creation; must match the database for the private network.
    region: frankfurt
    # Corepack runs the pnpm version pinned in package.json. Install everything, build the React
    # client (Vite), then reinstall production dependencies only, so the running service has just pg.
    # confirmModulesPurge=false: pnpm would otherwise ask before relinking, and stop without a terminal.
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && corepack pnpm build && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --prod --frozen-lockfile --config.confirmModulesPurge=false
    # Applies pending migrations under an advisory lock, then binds; sets PUBLIC_ORIGIN from RENDER_EXTERNAL_URL.
    startCommand: node --experimental-strip-types scripts/projectops-render-start.mjs
    # New instances receive traffic only once PostgreSQL answers; deploys are zero-downtime.
    healthCheckPath: /health/ready
    # Render does not deploy on its own. The CI workflow's deploy job calls this service's deploy
    # hook for each merged commit once its checks pass, then waits until /health/live reports it.
    # main changes only through reviewed, merged pull requests, so merging is the deploy approval.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: projectops-postgres
          # The private-network URL; the database is not reachable from the internet (ipAllowList below).
          property: connectionString

databases:
  - name: projectops-postgres
    # Smallest paid database (0.1 CPU, 256 MB, 100 connections). Free databases are deleted after 30 days.
    plan: 0.1c-256mb
    region: frankfurt
    # The version CI tests against. Fixed at creation.
    postgresMajorVersion: "16"
    # The default for this tier is 15 GB, billed per GB. 1 GB is plenty for one operator; disks can grow later, not shrink.
    diskSizeGB: 1
    # Private network only: no public connections at all.
    ipAllowList: []
