name: CI

# One workflow for every change: repository checks and native tests on the
# supported Node range, then the real PostgreSQL and Chromium acceptance suites.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check. On main nothing is
# cancelled: a merge's run, including its deploy, finishes before the next one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: lowest major allowed by package.json engines (>=22.6.0).
        # 24.19.0: the production runtime version.
        node: ['22', '24.19.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Repository hygiene + every native test suite.
      - run: pnpm verify

  acceptance:
    name: acceptance (postgres + chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectops
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: projectops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectops -d projectops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI-only database; not a secret.
      PROJECTOPS_TEST_DATABASE_URL: postgres://projectops:acceptance-only@localhost:5432/projectops_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # pg_dump/pg_restore matching the server, for the backup/restore drill.
      # The server serves the built React client; the browser suites need it.
      - run: pnpm build
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pnpm test:postgres
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # Production deploy: only for a push to main (a merged pull request), only after both jobs
  # above pass. Render's own auto-deploy is off, so this job is the one place a deploy starts,
  # and it fails unless the live service ends up running this exact commit.
  deploy:
    name: deploy (render)
    needs: [verify, acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One production deploy at a time; a newer merge waits instead of cancelling a running deploy.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Deploy this commit and wait until it is live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PROJECTOPS_ORIGIN: ${{ vars.PROJECTOPS_ORIGIN }}
        run: node scripts/projectops-deploy.mjs
