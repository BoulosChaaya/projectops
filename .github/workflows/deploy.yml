name: Deploy Gate

on:
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm verify
      - run: echo "Deployment is intentionally environment-owned."
