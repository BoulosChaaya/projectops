name: Deploy Trigger

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm verify
      - run: echo "Ready for the deployment system selected by the consuming project."
