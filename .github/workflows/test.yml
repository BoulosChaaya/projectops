name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectops
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: projectops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectops -d projectops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
        env:
          PROJECTOPS_TEST_DATABASE_URL: postgres://projectops:acceptance-only@localhost:5432/projectops_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
        env:
          PROJECTOPS_TEST_DATABASE_URL: postgres://projectops:acceptance-only@localhost:5432/projectops_test
