name: Deployed smoke
run-name: Deployed smoke (${{ inputs.phase }})

# Runs the browser acceptance journey against the live Render service. Started by hand after a
# deploy, because it writes one archived acceptance client and project into production.
# Needs repository secrets PROJECTOPS_OPERATOR_LOGIN and PROJECTOPS_OPERATOR_PASSWORD and the
# repository variable PROJECTOPS_ORIGIN (the exact https:// origin, no trailing slash).
#
# The initial phase saves its receipt (acceptance ids, snapshot digest, saved defaults) as the
# run artifact `smoke-receipt`. The after-restart phase downloads the receipt of the latest
# successful initial run itself. The receipt is not copied through the log, where GitHub masks
# every secret value: a secret that also occurs inside a field name corrupts that name.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: initial creates the acceptance project; after-restart re-reads it after a Render restart or redeploy
        type: choice
        options: [initial, after-restart]
        default: initial

permissions:
  contents: read
  actions: read # download the initial run's receipt artifact

concurrency:
  group: deployed-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Explicit bash enables pipefail, so a failing smoke cannot be hidden by a later command.
        shell: bash
    steps:
      # The expected commit is main's head: what Render deploys once CI passes on it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Find the initial run's receipt
        if: inputs.phase == 'after-restart'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deployed-smoke.yml --status success --limit 50 \
            --json databaseId,displayTitle --jq '[.[] | select(.displayTitle == "Deployed smoke (initial)")][0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "No successful initial run with a receipt; run the initial phase first." >&2; exit 1; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name smoke-receipt --dir "$RUNNER_TEMP/initial"
          echo "Using the receipt from initial run $run_id: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
      - name: Run against the deployed service
        env:
          ORIGIN: ${{ vars.PROJECTOPS_ORIGIN }}
          LOGIN: ${{ secrets.PROJECTOPS_OPERATOR_LOGIN }}
          PASSWORD: ${{ secrets.PROJECTOPS_OPERATOR_PASSWORD }}
          PHASE: ${{ inputs.phase }}
        # Credentials travel only through the environment and stdin, never argv or the log.
        run: |
          node -e '
            const e = process.env;
            const config = { origin: e.ORIGIN, authorizeAcceptanceWrites: true, login: e.LOGIN, password: e.PASSWORD,
              checkpoint: require("node:child_process").execSync("git rev-parse HEAD").toString().trim() };
            if (e.PHASE === "after-restart") {
              const receipt = JSON.parse(require("node:fs").readFileSync(e.RUNNER_TEMP + "/initial/receipt.json", "utf8"));
              const { projectId, clientId, snapshotSha256, operatorDefaults } = receipt;
              Object.assign(config, { phase: "after-restart", renderRestartCompleted: true, projectId, clientId, snapshotSha256, operatorDefaults });
            }
            process.stdout.write(JSON.stringify(config));
          ' | node --experimental-strip-types scripts/projectops-deployed-smoke.mjs > receipt.json
          cat receipt.json
      - name: Save the receipt
        if: inputs.phase == 'initial'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-receipt
          path: receipt.json
          retention-days: 30
